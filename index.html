<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PD-54 · Protótipos</title>
  <style>
    :root { --azul: #0a2a66; --cinza: #5b6473; --borda: #e6e8ec; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f8; color: #1a1f29; padding: 24px;
    }
    .wrap { width: 100%; max-width: 760px; }
    h1 { font-size: 28px; margin: 0 0 4px; color: var(--azul); }
    p.sub { margin: 0 0 28px; color: var(--cinza); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    a.card {
      display: block; text-decoration: none; background: #fff; border: 1px solid var(--borda);
      border-radius: 14px; padding: 22px; transition: transform .12s ease, box-shadow .12s ease; color: inherit;
    }
    a.card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(10,42,102,.12); }
    .card h2 { margin: 0 0 6px; font-size: 18px; color: var(--azul); }
    .card span { color: var(--cinza); font-size: 14px; }
    .cta { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--azul); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PD-54 · Simuladores de Veículos</h1>
    <p class="sub">Protótipos navegáveis — FRANQ</p>
    <div class="grid">
      <a class="card" href="Financiamento/index.html">
        <h2>Financiamento de Veículos</h2>
        <span>Simulação com entrada, parcelas e chance de aprovação.</span>
        <div class="cta">Abrir simulador →</div>
      </a>
      <a class="card" href="Auto-Equity/index.html">
        <h2>Auto Equity</h2>
        <span>Empréstimo usando o veículo como garantia.</span>
        <div class="cta">Abrir simulador →</div>
      </a>
    </div>
  </div>
</body>
</html>
